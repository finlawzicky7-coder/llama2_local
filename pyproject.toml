[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crebrokerai"
version = "1.0.0"
description = "CREBrokerAI — All-in-One Commercial Real Estate Broker AI Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CREBrokerAI Team"},
]
keywords = ["commercial-real-estate", "crewai", "ai-agents", "lead-generation", "broker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "crewai[tools]>=0.80.0",
    "anthropic>=0.40.0",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sendgrid>=6.11.0",
    "twilio>=9.3.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.14.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = ["pytest>=8.0", "ruff>=0.8.0", "mypy>=1.13"]

[project.scripts]
crebrokerai = "crebrokerai.cli:app"

[tool.setuptools.packages.find]
include = ["crebrokerai*"]

[tool.ruff]
line-length = 100
target-version = "py311"
