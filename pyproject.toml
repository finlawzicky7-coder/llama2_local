[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crebrokerai"
version = "1.0.0"
description = "CREBrokerAI — All-in-One Commercial Real Estate Broker AI Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CREBrokerAI Team"},
]
keywords = ["commercial-real-estate", "crewai", "ai-agents", "lead-generation", "broker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "crewai[tools]>=0.80.0",
    "anthropic>=0.40.0",
    "streamlit>=1.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sendgrid>=6.11.0",
    "twilio>=9.0.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = ["pytest>=8.0", "ruff>=0.8.0", "mypy>=1.13"]

[project.scripts]
crebrokerai = "crebrokerai.cli:app"

[tool.setuptools.packages.find]
include = ["crebrokerai*"]

[tool.ruff]
line-length = 100
target-version = "py310"
