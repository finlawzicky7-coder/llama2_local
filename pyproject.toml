[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ringback"
version = "0.0.1"
description = "Ringback — inbound missed-call recovery agent for U.S. home-services contractors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "stripe>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ringback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
